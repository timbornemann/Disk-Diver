name: Release installers

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag, for example v1.2.3
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  DISK_DIVER_UPDATE_PUBLIC_KEY: ${{ vars.DISK_DIVER_UPDATE_PUBLIC_KEY }}

jobs:
  prepare:
    if: ${{ !github.event.deleted && !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
      complete: ${{ steps.tag.outputs.complete }}
      public_key: ${{ steps.tag.outputs.public_key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y python3-cryptography
      - name: Resolve tag and check existing release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I packaging/release.py prepare

  packages:
    needs: prepare
    if: needs.prepare.outputs.complete == 'false'
    uses: ./.github/workflows/build.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      public_key: ${{ needs.prepare.outputs.public_key }}

  publish:
    needs: [prepare, packages]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Disk-Diver-*
          path: packages
      - name: Install release signing tools
        run: sudo apt-get update && sudo apt-get install -y python3-cryptography
      - name: Sign installer manifest
        env:
          DISK_DIVER_UPDATE_PRIVATE_KEY: ${{ secrets.DISK_DIVER_UPDATE_PRIVATE_KEY }}
          DISK_DIVER_UPDATE_PUBLIC_KEY: ${{ needs.prepare.outputs.public_key }}
        run: /usr/bin/python3 -I packaging/release.py sign
      - name: Upload verified assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          DISK_DIVER_UPDATE_PUBLIC_KEY: ${{ needs.prepare.outputs.public_key }}
        run: /usr/bin/python3 -I packaging/release.py publish

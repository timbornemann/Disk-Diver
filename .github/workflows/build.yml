name: Build and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      version:
        type: string
        required: true
      public_key:
        type: string
        required: true

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.93.0'
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_REPO: ${{ inputs.version && github.repository || '' }}
  RELEASE_PUBLIC_KEY: ${{ inputs.public_key }}

jobs:
  linux:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-deb-amd64
            image: rust:1.93.0-bookworm
            package: linux.sh
            suffix: deb
          - platform: linux-rpm-x86_64
            image: fedora:44
            package: rpm.sh
            suffix: rpm
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Debian build dependencies
        if: matrix.suffix == 'deb'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential cmake qt6-base-dev qt6-qpa-plugins dpkg-dev ninja-build python3 python3-cryptography
      - name: Install Fedora build dependencies
        if: matrix.suffix == 'rpm'
        run: dnf install -y git gcc-c++ cmake ninja-build qt6-qtbase-devel qt6-qtbase-gui cargo python3 python3-cryptography rpm-build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Configure and build
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          flags=("-DDISK_DIVER_UPDATE_PLATFORM=$PLATFORM" "-DDISK_DIVER_UPDATE_REPOSITORY=$RELEASE_REPO" "-DDISK_DIVER_UPDATE_PUBLIC_KEY=$RELEASE_PUBLIC_KEY")
          if [[ -n "$RELEASE_VERSION" ]]; then flags+=("-DDISK_DIVER_VERSION=$RELEASE_VERSION"); fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=/usr/bin/python3 "${flags[@]}"
          cmake --build build --parallel
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure
          cargo test --locked --release --manifest-path rust/Cargo.toml
      - name: Build native installer
        env:
          PACKAGE_SCRIPT: ${{ matrix.package }}
        run: bash "packaging/$PACKAGE_SCRIPT" build dist
      - name: Install package and check its update channel
        env:
          PLATFORM: ${{ matrix.platform }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          case "$PLATFORM" in
            linux-deb-amd64) apt-get install -y ./dist/*.deb ;;
            linux-rpm-x86_64) dnf install -y ./dist/*.rpm ;;
          esac
          /usr/bin/python3 -I packaging/release.py check-installed /usr/lib/disk-diver "$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Disk-Diver-${{ matrix.platform }}
          path: dist/*.${{ matrix.suffix }}
          if-no-files-found: error
          overwrite: true

  ubuntu-install:
    name: Install Debian package on Ubuntu 24.04
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Disk-Diver-linux-deb-amd64
          path: dist
      - name: Install and exercise the release package
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb
          /usr/bin/python3 -I packaging/release.py check-installed /usr/lib/disk-diver linux-deb-amd64
          /usr/bin/python3 -I packaging/smoke.py /usr/lib/disk-diver --update-platform linux-deb-amd64

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      # The Qt action sets up its own Python. Select our build interpreter afterwards.
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: build_python
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: cryptography==50.0.2
      - name: Configure and build
        env:
          BUILD_PYTHON: ${{ steps.build_python.outputs.python-path }}
        run: |
          $flags = @("-DDISK_DIVER_UPDATE_PLATFORM=windows-x64", "-DDISK_DIVER_UPDATE_REPOSITORY=$env:RELEASE_REPO", "-DDISK_DIVER_UPDATE_PUBLIC_KEY=$env:RELEASE_PUBLIC_KEY")
          if ($env:RELEASE_VERSION) { $flags += "-DDISK_DIVER_VERSION=$env:RELEASE_VERSION" }
          cmake -S . -B build -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DPython3_EXECUTABLE=$env:BUILD_PYTHON" @flags
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:QT_PLUGIN_PATH = Join-Path $env:QT_ROOT_DIR 'plugins'
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.93.0 test --locked --release --manifest-path rust/Cargo.toml
      - name: Build Windows installer
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'python-3.14.9-embed-amd64.zip'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.14.9/python-3.14.9-embed-amd64.zip' -OutFile $zip
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          ./packaging/windows.ps1 -BuildDir build -QtBin "$env:QT_ROOT_DIR/bin" -PythonZip $zip -OutputDir dist
      - name: Install package and check its update channel
        run: |
          $installer = (Get-ChildItem -Path dist -Filter '*.exe' -File).FullName
          $setup = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -WindowStyle Hidden -PassThru -Wait
          if ($setup.ExitCode) { exit $setup.ExitCode }
          python -I packaging/release.py check-installed "$env:ProgramFiles/Disk-Diver" windows-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Disk-Diver-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          overwrite: true

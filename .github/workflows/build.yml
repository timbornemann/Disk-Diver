name: Build and package
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.93.0'

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-qpa-plugins dpkg-dev ninja-build
          rustup toolchain install 1.93.0 --profile minimal
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure
          cargo +1.93.0 test --locked --release --manifest-path rust/Cargo.toml
      - name: Build Debian package
        run: bash packaging/linux.sh build dist
      - uses: actions/upload-artifact@v4
        with:
          name: Disk-Diver-ubuntu-24.04-amd64
          path: dist/*.deb
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure and build
        run: |
          cmake -S . -B build -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          cmake --build build --config Release --parallel
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.93.0 test --locked --release --manifest-path rust/Cargo.toml
      - name: Build Windows installer
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'python-3.14.9-embed-amd64.zip'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.14.9/python-3.14.9-embed-amd64.zip' -OutFile $zip
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          ./packaging/windows.ps1 -BuildDir build -QtBin "$env:QT_ROOT_DIR/bin" -PythonZip $zip -OutputDir dist
      - uses: actions/upload-artifact@v4
        with:
          name: Disk-Diver-windows-x64
          path: dist/*.exe
          if-no-files-found: error
